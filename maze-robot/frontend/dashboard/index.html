<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Maze Robot Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="shell" id="shell"></div>

  <script src="../js/api.js"></script>
  <script src="../js/socket.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>Auth.requireAuth();</script>
  <script>
    document.getElementById('shell').innerHTML = renderSidebar('Dashboard') + `
      <main class="main">
        <div class="topbar">
          <div>
            <h1>Robot Dashboard</h1>
            <div class="sub">Live telemetry &middot; updates every 100ms</div>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="pill offline" id="connPill"><span class="dot"></span>Offline</span>
            <span class="pill" id="latencyPill">-- ms</span>
          </div>
        </div>

        <div class="grid cols-4" style="margin-bottom:16px;">
          <div class="glass stat-card"><div class="label">State</div><div class="value small" id="stState">IDLE</div></div>
          <div class="glass stat-card"><div class="label">Current Action</div><div class="value small" id="stAction">--</div></div>
          <div class="glass stat-card"><div class="label">Position</div><div class="value" id="stPos">(0,0)</div></div>
          <div class="glass stat-card"><div class="label">Heading</div><div class="value" id="stHeading">N</div></div>
        </div>

        <div class="grid cols-4" style="margin-bottom:16px;">
          <div class="glass stat-card"><div class="label">Exploration %</div><div class="value" id="stPct">0%</div></div>
          <div class="glass stat-card"><div class="label">Cells Visited</div><div class="value" id="stVisited">0</div></div>
          <div class="glass stat-card"><div class="label">Dead Ends</div><div class="value" id="stDeadEnds">0</div></div>
          <div class="glass stat-card"><div class="label">Intersections</div><div class="value" id="stIntersections">0</div></div>
        </div>

        <div class="grid cols-4" style="margin-bottom:16px;">
          <div class="glass stat-card"><div class="label">Turns</div><div class="value" id="stTurns">0</div></div>
          <div class="glass stat-card"><div class="label">Cells Traveled</div><div class="value" id="stDistance">0</div></div>
          <div class="glass stat-card"><div class="label">Loop / Runtime</div><div class="value small" id="stRuntime">0s</div></div>
          <div class="glass stat-card"><div class="label">Wi-Fi RSSI</div><div class="value small" id="stWifi">-- dBm</div></div>
        </div>

        <div class="glass" style="padding:20px;" id="celebrationBanner" style="display:none;"></div>
      </main>`;

    const socket = connectSocket();
    let startedAt = null;

    socket.on('robot_status', (s) => {
      const pill = document.getElementById('connPill');
      pill.className = 'pill ' + (s.connected ? 'online' : 'offline');
      pill.innerHTML = `<span class="dot"></span>${s.connected ? 'Online' : 'Offline'}`;
    });

    socket.on('telemetry', (t) => {
      document.getElementById('stState').textContent = t.state || '--';
      document.getElementById('stAction').textContent = t.action || '--';
      document.getElementById('stPos').textContent = `(${t.x ?? 0},${t.y ?? 0})`;
      document.getElementById('stHeading').textContent = t.heading || '-';
      document.getElementById('stPct').textContent = `${(t.explorationPercent ?? 0).toFixed(1)}%`;
      document.getElementById('stVisited').textContent = t.visitedCells ?? 0;
      document.getElementById('stDeadEnds').textContent = t.deadEnds ?? 0;
      document.getElementById('stIntersections').textContent = t.intersections ?? 0;
      document.getElementById('stTurns').textContent = t.turns ?? 0;
      document.getElementById('stDistance').textContent = t.cellsTraveled ?? 0;
      document.getElementById('stWifi').textContent = `${t.wifiRSSI ?? '--'} dBm`;
      document.getElementById('latencyPill').textContent = `${t.latencyMs ?? '--'} ms`;
      if (!startedAt) startedAt = Date.now();
    });

    socket.on('robot_event', (e) => {
      if (e.event === 'mission_complete') showToast('🎉 Goal reached! Running celebration...', 'success');
      if (e.event === 'celebration_complete') showToast('🎉 Maze Solved! Mission complete.', 'success');
      if (e.event === 'maze_completed') showToast('Maze fully explored. Planning shortest path...', 'info');
    });

    setInterval(() => {
      if (startedAt) {
        const secs = Math.floor((Date.now() - startedAt) / 1000);
        document.getElementById('stRuntime').textContent = `${secs}s`;
      }
    }, 1000);
  </script>
</body>
</html>
