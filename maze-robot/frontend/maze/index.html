<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Maze · Maze Robot Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="shell" id="shell"></div>

  <script src="../js/api.js"></script>
  <script src="../js/socket.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/maze-renderer.js"></script>
  <script>Auth.requireAuth();</script>
  <script>
    document.getElementById('shell').innerHTML = renderSidebar('Live Maze') + `
      <main class="main">
        <div class="topbar">
          <div><h1>Live Maze Viewer</h1><div class="sub">Occupancy grid, reconstructed in real time from ultrasonic + motion data</div></div>
          <span class="pill" id="pctPill">0% explored</span>
        </div>

        <div class="maze-canvas-wrap">
          <div class="maze-toolbar">
            <button id="zoomIn" title="Zoom in">+</button>
            <button id="zoomOut" title="Zoom out">&minus;</button>
            <button id="resetView" title="Reset view">&#8635;</button>
            <button id="fullscreen" title="Fullscreen">&#9974;</button>
          </div>
          <canvas id="mazeCanvas"></canvas>
        </div>

        <div class="legend">
          <span class="sw"><i style="background:var(--cell-unknown)"></i>Unknown</span>
          <span class="sw"><i style="background:var(--cell-wall)"></i>Wall</span>
          <span class="sw"><i style="background:var(--cell-open)"></i>Open</span>
          <span class="sw"><i style="background:var(--cell-visited)"></i>Visited</span>
          <span class="sw"><i style="background:var(--cell-robot)"></i>Robot</span>
          <span class="sw"><i style="background:var(--cell-goal)"></i>Goal</span>
          <span class="sw"><i style="background:var(--cell-path)"></i>Shortest Path</span>
        </div>

        <h2 style="margin:28px 0 14px; font-size:16px;">Exploration Statistics</h2>
        <div class="grid cols-4">
          <div class="glass stat-card"><div class="label">Visited Cells</div><div class="value" id="exVisited">0</div></div>
          <div class="glass stat-card"><div class="label">Unknown Cells</div><div class="value" id="exUnknown">256</div></div>
          <div class="glass stat-card"><div class="label">Intersections</div><div class="value" id="exIntersections">0</div></div>
          <div class="glass stat-card"><div class="label">Dead Ends</div><div class="value" id="exDeadEnds">0</div></div>
          <div class="glass stat-card"><div class="label">Turns</div><div class="value" id="exTurns">0</div></div>
          <div class="glass stat-card"><div class="label">Distance Travelled</div><div class="value" id="exDistance">0 cells</div></div>
          <div class="glass stat-card"><div class="label">Total Decisions</div><div class="value" id="exDecisions">0</div></div>
          <div class="glass stat-card"><div class="label">Algorithm</div><div class="value small">DFS + Flood Fill</div></div>
        </div>
      </main>`;

    const canvas = document.getElementById('mazeCanvas');
    const renderer = new MazeRenderer(canvas, 16);

    document.getElementById('zoomIn').onclick = () => renderer.zoom(1.2);
    document.getElementById('zoomOut').onclick = () => renderer.zoom(0.8);
    document.getElementById('resetView').onclick = () => renderer.resetView();
    document.getElementById('fullscreen').onclick = () => renderer.toggleFullscreen();

    const socket = connectSocket();
    const GRID_TOTAL = 16 * 16;
    socket.on('telemetry', (t) => {
      renderer.updateRobot(t);
      document.getElementById('pctPill').textContent = `${(t.explorationPercent ?? 0).toFixed(1)}% explored`;
      document.getElementById('exVisited').textContent = t.visitedCells ?? 0;
      document.getElementById('exUnknown').textContent = Math.max(0, GRID_TOTAL - (t.visitedCells ?? 0));
      document.getElementById('exIntersections').textContent = t.intersections ?? 0;
      document.getElementById('exDeadEnds').textContent = t.deadEnds ?? 0;
      document.getElementById('exTurns').textContent = t.turns ?? 0;
      document.getElementById('exDistance').textContent = `${t.cellsTraveled ?? 0} cells`;
      document.getElementById('exDecisions').textContent = t.totalDecisions ?? 0;
    });
    // Incremental: each cell fills in the instant the robot senses it
    socket.on('cell_update', (cell) => renderer.updateCell(cell));
    // Full snapshot: sent once exploration completes, includes the shortest path
    socket.on('map_update', (msg) => renderer.setMapSnapshot(msg));
  </script>
</body>
</html>
