<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History · Maze Robot Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="shell" id="shell"></div>

  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/maze-renderer.js"></script>
  <script>Auth.requireAuth();</script>
  <script>
    document.getElementById('shell').innerHTML = renderSidebar('History') + `
      <main class="main">
        <div class="topbar">
          <div><h1>Run History</h1><div class="sub">Every completed exploration, saved with its full map and replayable path</div></div>
        </div>
        <div class="glass" style="padding:0; overflow:hidden;">
          <table id="runsTable">
            <thead><tr><th>Date</th><th>Robot</th><th>Visited</th><th>Turns</th><th>Distance</th><th>Complete</th><th>Files</th><th></th></tr></thead>
            <tbody id="runsBody"><tr><td colspan="8" style="color:var(--text-secondary);">Loading...</td></tr></tbody>
          </table>
        </div>

        <div id="replayPanel" style="display:none; margin-top:24px;">
          <h2 style="font-size:16px; margin-bottom:14px;">Replay</h2>
          <div class="maze-canvas-wrap" style="height:520px;">
            <canvas id="replayCanvas"></canvas>
          </div>
          <div style="display:flex; gap:10px; margin-top:12px;">
            <button class="btn primary" id="playBtn">&#9654; Play</button>
            <button class="btn" id="pauseReplayBtn">&#10074;&#10074; Pause</button>
            <button class="btn" id="restartBtn">&#8635; Restart</button>
            <input type="range" id="scrubber" min="0" value="0" style="flex:1;">
          </div>
        </div>
      </main>`;

    let replayer = null, replayPath = [], replayIdx = 0, playing = false;

    async function loadRuns() {
      const data = await apiFetch('/api/history?limit=50');
      const body = document.getElementById('runsBody');
      if (!data.runs.length) {
        body.innerHTML = '<tr><td colspan="8" style="color:var(--text-secondary);">No completed runs yet.</td></tr>';
        return;
      }
      body.innerHTML = data.runs.map(r => `
        <tr>
          <td>${new Date(r.createdAt).toLocaleString()}</td>
          <td class="mono">${r.robotId}</td>
          <td>${r.stats?.visitedCells ?? '-'}</td>
          <td>${r.stats?.turns ?? '-'}</td>
          <td>${r.stats?.cellsTraveled ?? '-'} cells</td>
          <td>${r.missionComplete ? '✅' : '—'}</td>
          <td>${r.maze?.files ? `
            <a href="${API_BASE}${r.maze.files.json}" target="_blank">JSON</a> ·
            <a href="${API_BASE}${r.maze.files.csv}" target="_blank">CSV</a> ·
            <a href="${API_BASE}${r.maze.files.png}" target="_blank">PNG</a> ·
            <a href="${API_BASE}${r.maze.files.svg}" target="_blank">SVG</a>` : '—'}</td>
          <td><button class="btn" data-replay="${r._id}">Replay</button></td>
        </tr>`).join('');

      document.querySelectorAll('[data-replay]').forEach(btn => {
        btn.addEventListener('click', () => openReplay(btn.dataset.replay));
      });
    }

    async function openReplay(id) {
      const { run } = await apiFetch(`/api/history/${id}`);
      replayPath = run.path || [];
      replayIdx = 0;
      document.getElementById('replayPanel').style.display = 'block';
      document.getElementById('scrubber').max = Math.max(0, replayPath.length - 1);
      if (!replayer) replayer = new MazeRenderer(document.getElementById('replayCanvas'), run.maze?.gridSize || 16);
      if (run.maze) {
        replayer.setMapSnapshot({ cells: run.maze.cells, shortestPath: run.maze.shortestPath });
      }
      renderReplayFrame();
      document.getElementById('replayPanel').scrollIntoView({ behavior: 'smooth' });
    }

    function renderReplayFrame() {
      if (!replayPath.length) return;
      const frame = replayPath[replayIdx];
      replayer.updateRobot(frame);
      document.getElementById('scrubber').value = replayIdx;
    }

    document.addEventListener('click', (e) => {
      if (e.target.id === 'playBtn') { playing = true; }
      if (e.target.id === 'pauseReplayBtn') { playing = false; }
      if (e.target.id === 'restartBtn') { replayIdx = 0; renderReplayFrame(); }
    });
    document.addEventListener('input', (e) => {
      if (e.target.id === 'scrubber') { replayIdx = parseInt(e.target.value); renderReplayFrame(); }
    });

    setInterval(() => {
      if (playing && replayPath.length) {
        replayIdx = Math.min(replayPath.length - 1, replayIdx + 1);
        renderReplayFrame();
        if (replayIdx >= replayPath.length - 1) playing = false;
      }
    }, 150);

    loadRuns();
  </script>
</body>
</html>
