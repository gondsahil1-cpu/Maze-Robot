<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controls · Maze Robot Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="shell" id="shell"></div>

  <script src="../js/api.js"></script>
  <script src="../js/socket.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>Auth.requireAuth();</script>
  <script>
    const isAdmin = Auth.isAdmin();
    document.getElementById('shell').innerHTML = renderSidebar('Controls') + `
      <main class="main">
        <div class="topbar">
          <div><h1>Robot Control</h1><div class="sub">Every command is acknowledged by the robot in real time</div></div>
          <span class="pill offline" id="connPill"><span class="dot"></span>Offline</span>
        </div>

        ${!isAdmin ? `<div class="glass" style="padding:16px; margin-bottom:20px; border-color:#f59e0b; color:#fbbf24;">
          Viewer role: controls are read-only. Sign in as an administrator to operate the robot.</div>` : ''}

        <div class="grid cols-3" style="margin-bottom:24px;">
          <button class="btn primary" data-cmd="START" ${!isAdmin?'disabled':''}>&#9654; START</button>
          <button class="btn" data-cmd="PAUSE" ${!isAdmin?'disabled':''}>&#10074;&#10074; PAUSE</button>
          <button class="btn" data-cmd="RESUME" ${!isAdmin?'disabled':''}>&#9654;&#9654; RESUME</button>
          <button class="btn warn" data-cmd="STOP" ${!isAdmin?'disabled':''}>&#9632; STOP</button>
          <button class="btn" data-cmd="RETURN_HOME" ${!isAdmin?'disabled':''}>&#8962; RETURN HOME</button>
          <button class="btn" data-cmd="CALIBRATE" ${!isAdmin?'disabled':''}>&#9881; CALIBRATE</button>
          <button class="btn" data-cmd="RESET_MAZE" ${!isAdmin?'disabled':''}>&#8635; RESET MAZE</button>
          <button class="btn" data-cmd="CLEAR_MAP" ${!isAdmin?'disabled':''}>&#128465; CLEAR MAP</button>
          <button class="btn danger" data-cmd="EMERGENCY_STOP" ${!isAdmin?'disabled':''}>&#9888; EMERGENCY STOP</button>
        </div>

        <div class="glass" style="padding:20px; margin-bottom:24px;">
          <h2 style="font-size:15px; margin-bottom:14px;">Set Goal Cell</h2>
          <div style="display:flex; gap:12px; align-items:flex-end;">
            <div class="field" style="margin:0;"><label>X</label><input type="number" id="goalX" value="8" min="0" max="15" style="width:90px;"></div>
            <div class="field" style="margin:0;"><label>Y</label><input type="number" id="goalY" value="8" min="0" max="15" style="width:90px;"></div>
            <button class="btn primary" id="setGoalBtn" ${!isAdmin?'disabled':''}>Set Goal</button>
          </div>
        </div>

        <div class="glass" style="padding:20px;">
          <h2 style="font-size:15px; margin-bottom:12px;">Command Log</h2>
          <div id="cmdLog" class="mono" style="font-size:12px; color:var(--text-secondary); max-height:240px; overflow-y:auto;"></div>
        </div>
      </main>`;

    const socket = connectSocket();
    socket.on('robot_status', (s) => {
      const pill = document.getElementById('connPill');
      pill.className = 'pill ' + (s.connected ? 'online' : 'offline');
      pill.innerHTML = `<span class="dot"></span>${s.connected ? 'Online' : 'Offline'}`;
    });

    function logLine(text) {
      const el = document.getElementById('cmdLog');
      const row = document.createElement('div');
      row.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      el.prepend(row);
    }

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const cmd = btn.dataset.cmd;
        try {
          await sendRobotCommand(socket, cmd);
          logLine(`Sent ${cmd}`);
          showToast(`Command sent: ${cmd}`, 'success');
        } catch (err) {
          logLine(`FAILED ${cmd}: ${err.message}`);
          showToast(err.message, 'error');
        }
      });
    });

    document.getElementById('setGoalBtn')?.addEventListener('click', async () => {
      const x = parseInt(document.getElementById('goalX').value);
      const y = parseInt(document.getElementById('goalY').value);
      try {
        await sendRobotCommand(socket, 'SET_GOAL', { x, y });
        logLine(`Sent SET_GOAL (${x},${y})`);
        showToast('Goal cell updated', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    socket.on('command_ack', (ack) => logLine(`ACK: ${ack.command}`));
  </script>
</body>
</html>
