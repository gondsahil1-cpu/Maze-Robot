<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Maze Robot Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="glass login-card" id="resetForm">
      <div class="brand-row"><span class="dot"></span><strong style="font-family:var(--font-display)">MAZE ROBOT LAB</strong></div>
      <h1>Choose a new password</h1>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <button class="btn primary full" type="submit">Update password</button>
      <div class="error-msg" id="msg"></div>
    </form>
  </div>
  <script src="../js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      try {
        await apiFetch('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password }) });
        msg.style.color = '#4ade80';
        msg.textContent = 'Password updated — redirecting to sign in...';
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        msg.style.color = '#f87171';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
