<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password · Maze Robot Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="glass login-card" id="forgotForm">
      <div class="brand-row"><span class="dot"></span><strong style="font-family:var(--font-display)">MAZE ROBOT LAB</strong></div>
      <h1>Reset your password</h1>
      <p class="tagline">Enter your account email and we'll send you a reset link.</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <button class="btn primary full" type="submit">Send reset link</button>
      <div class="error-msg" id="msg"></div>
      <p style="margin-top:16px; font-size:13px; text-align:center;"><a href="index.html">&larr; Back to sign in</a></p>
    </form>
  </div>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      try {
        const data = await apiFetch('/api/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
        msg.style.color = '#4ade80';
        msg.textContent = data.message;
      } catch (err) {
        msg.style.color = '#f87171';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
